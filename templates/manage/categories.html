{% extends "base.html" %}
{% block title %}Категорії{% endblock %}
{% block content %}
<h1>Категорії заявок</h1>
<form class="card actions" method="post">{% csrf_token %}
  <input name="name" placeholder="Нова категорія" style="flex:1" required><button class="btn">Додати</button></form>
<div class="table-wrap"><table>
  <tr><th>Назва</th><th>Заявок</th><th></th></tr>
  {% for c in categories %}
  <tr>
    <td><form class="actions" method="post" action="{% url 'manage_category_rename' c.pk %}">{% csrf_token %}
      <input name="name" value="{{ c.name }}" style="max-width:300px"><button class="btn secondary sm">Перейменувати</button></form></td>
    <td>{{ c.n }}</td>
    <td><form class="inline" method="post" action="{% url 'manage_category_delete' c.pk %}" onsubmit="return confirm('Видалити категорію?')">{% csrf_token %}
      <button class="btn danger sm">Видалити</button></form></td>
  </tr>
  {% endfor %}
</table></div>
{% endblock %}
